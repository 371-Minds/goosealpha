# Ceramic SDL — Immutable Audit Trail (decentralized, verifiable data)
#
# Deploy:
#   akash tx deployment create ceramic.yaml --from $AKASH_KEY_NAME
#
# Provides:
#   - Ceramic node HTTP API on port 7007
#
# Connect from Goose agents:
#   CERAMIC_URL=http://<provider-host>:7007
#
---
version: "2.0"

services:
  ceramic:
    image: ceramicnetwork/js-ceramic:5.10.0
    env:
      - CERAMIC_NETWORK=mainnet
    expose:
      - port: 7007
        as: 7007
        to:
          - global: true
    params:
      storage:
        ceramic-data:
          mount: /root/.ceramic
          readOnly: false

profiles:
  compute:
    ceramic:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 1Gi
        storage:
          - name: ceramic-data
            size: 10Gi
            attributes:
              persistent: true
              class: beta3
  placement:
    goose-swarm:
      attributes:
        region: us-east
      signedBy:
        anyOf:
          - akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63
      pricing:
        ceramic:
          denom: uakt
          amount: 300

deployment:
  ceramic:
    goose-swarm:
      profile: ceramic
      count: 1
